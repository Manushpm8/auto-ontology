# Builds the WWI (Wide World Importers) demo-data seed image and pushes it to
# nvcr.io. Built only when the seed definition changes (or on demand); it has no
# NeMo-Retriever dependency, so CI can produce it directly. Requires repo secret:
#   NGC_API_KEY - an NGC API key with push access to nvcr.io/nvstaging/gsf

name: Publish WWI seed image to nvcr.io

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'deploy/wwi-seed/**'

env:
  IMAGE: nvcr.io/nvstaging/gsf/gsf-wwi-seed

jobs:
  publish-wwi-seed:
    name: Build & push WWI seed image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to nvcr.io
        uses: docker/login-action@v3
        with:
          registry: nvcr.io
          username: $oauthtoken
          password: ${{ secrets.NGC_API_KEY }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: deploy/wwi-seed
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Summary
        run: |
          echo "Published \`${IMAGE}:latest\` and \`${IMAGE}:${{ github.sha }}\`" >>"$GITHUB_STEP_SUMMARY"
