# CI gate: verify the GSF app (backend/ingestion) and Next.js frontend Docker
# images build successfully. Builds only — nothing is pushed — so a broken
# Dockerfile or dependency fails the PR before the staging-publish-* workflows
# (which do push to nvcr.io) ever run.
#
# Both Dockerfiles FROM nvcr.io/nvidia/base/ubuntu; the nvcr.io login step is
# gated on the NGC_API_KEY secret so in-org PRs pull the base authenticated
# while forks fall back to an anonymous pull.

name: 'CI: Verify image builds'

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# One in-flight run per ref; newer pushes cancel superseded builds.
concurrency:
  group: ci-image-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }} image
    runs-on: ubuntu-latest
    # The `secrets` context is not allowed in `if:` expressions, so surface the
    # NGC key as an env var and gate the nvcr.io login on that instead.
    env:
      NGC_API_KEY: ${{ secrets.NGC_API_KEY }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GSF Server
            context: .
            file: Dockerfile
            build-args: ''
          - name: frontend
            context: ./frontend
            file: frontend/Dockerfile
            # Baked into the Next.js build; must match the in-cluster backend
            # Service name (mirrors staging-publish-frontend.yml).
            build-args: |
              PYTHON_API_URL=http://gsf:3001
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to nvcr.io (for base image)
        if: ${{ env.NGC_API_KEY != '' }}
        uses: docker/login-action@v3
        with:
          registry: nvcr.io
          username: '$oauthtoken'
          password: ${{ env.NGC_API_KEY }}

      - name: Build ${{ matrix.name }} image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: false
          load: false
          build-args: ${{ matrix.build-args }}
          cache-from: type=gha,scope=${{ matrix.file }}
          cache-to: type=gha,mode=max,scope=${{ matrix.file }}
          provenance: false
