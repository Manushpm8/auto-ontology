# Minimal Postgres 17 + Neo4j 2025.09.0 sidecars for trying out the gsf chart
# in a local cluster (Docker Desktop k8s, kind, minikube, etc.).
#
# This is NOT production-grade — there are no PVCs, no resource limits, no
# auth rotation, no HA. The credentials match the chart defaults and the
# .env.example file in the repo root. Override before deploying anywhere
# real.
#
#   kubectl create namespace gsf
#   kubectl -n gsf apply -f helm/gsf/examples/postgres-neo4j.yaml
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17
          env:
            - name: POSTGRES_USER
              value: gsf
            - name: POSTGRES_PASSWORD
              value: gsf_dev
            - name: POSTGRES_DB
              value: gsf
          ports:
            - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: neo4j
spec:
  selector:
    app: neo4j
  ports:
    - name: bolt
      port: 7687
      targetPort: 7687
    - name: http
      port: 7474
      targetPort: 7474
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: neo4j
spec:
  replicas: 1
  selector:
    matchLabels:
      app: neo4j
  template:
    metadata:
      labels:
        app: neo4j
    spec:
      containers:
        - name: neo4j
          image: neo4j:2025.09.0
          env:
            - name: NEO4J_AUTH
              value: neo4j/changeme123
            - name: NEO4J_server_config_strict__validation_enabled
              value: "false"
            - name: NEO4J_dbms_security_auth__minimum__password__length
              value: "3"
          ports:
            - containerPort: 7687
            - containerPort: 7474
