{{- if and .Values.frontend.enabled .Values.frontend.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "gsf.serviceAccountName" (list . "frontend" .Values.frontend.serviceAccount) }}
  labels:
    {{- include "gsf.componentLabels" (list . "frontend") | nindent 4 }}
  {{- with .Values.frontend.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end -}}
