{{- if and .Values.backend.enabled .Values.backend.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "gsf.serviceAccountName" (list . "backend" .Values.backend.serviceAccount) }}
  labels:
    {{- include "gsf.componentLabels" (list . "backend") | nindent 4 }}
  {{- with .Values.backend.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end -}}
