{{- if .Values.frontend.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gsf.componentFullname" (list . "frontend") }}
  labels:
    {{- include "gsf.componentLabels" (list . "frontend") | nindent 4 }}
  {{- with .Values.frontend.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "gsf.componentSelectorLabels" (list . "frontend") | nindent 4 }}
{{- end -}}
