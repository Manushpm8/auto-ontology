apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gsf.secretName" . }}
  labels:
    {{- include "gsf.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.secrets.postgresUser | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  POSTGRES_DATABASE: {{ .Values.secrets.postgresDatabase | quote }}
  POSTGRES_HOST: {{ printf "%s-postgres" (include "gsf.fullname" .) | quote }}
  POSTGRES_PORT: {{ .Values.postgres.service.port | quote }}
  NEO4J_USERNAME: {{ .Values.secrets.neo4jUsername | quote }}
  NEO4J_PASSWORD: {{ .Values.secrets.neo4jPassword | quote }}
  NEO4J_URI: {{ printf "bolt://%s-neo4j:%d" (include "gsf.fullname" .) (int .Values.neo4j.service.boltPort) | quote }}
  PGADMIN_EMAIL: {{ .Values.secrets.pgadminEmail | quote }}
  PGADMIN_PASSWORD: {{ .Values.secrets.pgadminPassword | quote }}
  NVIDIA_API_KEY: {{ .Values.secrets.nvidiaApiKey | quote }}
  BASE_URL: {{ .Values.secrets.baseUrl | quote }}
  MODEL_NAME: {{ .Values.secrets.modelName | quote }}
  EMBED_ENDPOINT: {{ .Values.secrets.embedEndpoint | quote }}
  EMBED_MODEL: {{ .Values.secrets.embedModel | quote }}
  CONNECTION_STRINGS: {{ .Values.secrets.connectionStrings | quote }}
