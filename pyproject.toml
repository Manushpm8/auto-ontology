[project]
name = "gsf-server"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "nemo-retriever",
    "neo4j>=6.1.0",
    "pandas>=2.0,<3",
    "psycopg2-binary>=2.9.11",
    "python-dotenv>=1.2.2",
    "torch~=2.10.0",
    "torchvision>=0.25,<0.26",
    "uvicorn[standard]>=0.32.0",
]

[tool.uv]
package = false
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]
# Override nemo-retriever's transitive torch~=2.9.1 / torchvision<0.25
# pins to pull in CVE-2026-24747 (weights_only unpickler) fix shipped in
# torch 2.10.0. nemo-retriever upstream is blocked on the vLLM <-> torch
# <-> transformers compatibility triangle (per Julio Perez,
# 2026-05-11); they will bump once vLLM's torch anchor moves.
override-dependencies = [
    "torch~=2.10.0",
    "torchvision>=0.25,<0.26",
]

[tool.uv.sources]
nemo-retriever = { path = "../../nemo-project/NeMo-Retriever/nemo_retriever", editable = true }
torch = [
  { index = "torch-cpu", marker = "sys_platform == 'darwin'" },
]
torchvision = [
  { index = "torch-cpu", marker = "sys_platform == 'darwin'" },
]

[[tool.uv.index]]
name = "torch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "ruff>=0.15.9",
]
