[project]
name = "gsf-server"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "langchain-postgres>=0.0.17",
    "nemo-retriever[tabular]",
    "neo4j>=6.1.0",
    "pandas>=2.0,<3",
    "psycopg[binary]>=3.3.3",
    "python-dotenv>=1.2.2",
    "torch~=2.9.1",
    "torchvision>=0.24,<0.25",
    "uvicorn[standard]>=0.32.0",
]


[tool.uv.sources]
nemo-retriever = { path = "../../nemo-project/NeMo-Retriever/nemo_retriever", editable = true }

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "ruff>=0.15.9",
]
