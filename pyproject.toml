[project]
name = "gsf-server"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "nemo-retriever",
    "neo4j>=6.1.0",
    "pandas>=2.0,<3",
    "psycopg2-binary>=2.9.11",
    "python-dotenv>=1.2.2",
    "torch~=2.9.1",
    "torchvision>=0.24,<0.25",
    "uvicorn[standard]>=0.32.0",
]

[tool.uv]
package = false
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.uv.sources]
nemo-retriever = { path = "vendor/nemo-project/nemo_retriever", editable = true }
torch = [
  { index = "torch-cpu", marker = "sys_platform == 'darwin'" },
]
torchvision = [
  { index = "torch-cpu", marker = "sys_platform == 'darwin'" },
]

[[tool.uv.index]]
name = "torch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "ruff>=0.15.9",
]
