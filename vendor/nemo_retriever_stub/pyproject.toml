[project]
name = "nemo-retriever"
version = "0.0.0+stub"
description = "Stub of NeMo-Retriever used for Docker / CI builds when the real package is not available."
requires-python = ">=3.12,<3.14"
dependencies = [
    # Transitive deps that gsf imports directly but expects nemo-retriever to provide.
    "langchain-core>=0.3.0",
    "duckdb>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nemo_retriever"]
